<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sprite Editor</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header id="toolbar">
		<button id="fileMenuBtn" class="menu-trigger" title="File">
			File <span class="chevron">▾</span>
		</button>

		<span class="sep"></span>

		<button id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
		<button id="btnRedo" title="Redo (Ctrl+Shift+Z)">↷</button>

		<span class="sep"></span>

		<div class="tool-group">
			<button class="tool-btn" data-tool="pan"     title="Pan (P)">Pan</button>
			<button class="tool-btn" data-tool="pencil"  title="Pencil (N)">Pencil</button>
			<button class="tool-btn" data-tool="line"    title="Line (L)">Line</button>
			<button class="tool-btn" data-tool="box"     title="Box (B)">Box</button>
			<button class="tool-btn" data-tool="ellipse" title="Ellipse (O)">Oval</button>
			<button class="tool-btn" data-tool="fill"    title="Flood fill (F)">Fill</button>
			<button class="tool-btn" data-tool="picker"  title="Eyedropper (I)">Pick</button>
		</div>

		<label class="checkbox" title="Fill new boxes and ellipses">
			<input type="checkbox" id="fillShapes"> Fill
		</label>

		<label class="checkbox" title="Confine strokes to the selected frame">
			<input type="checkbox" id="clipToFrame" checked> Clip
		</label>

		<span class="sep"></span>

		<button id="btnFit" title="Fit sheet to view">Fit</button>
		<button id="btnZoomOut" title="Zoom out">−</button>
		<button id="btnZoomIn"  title="Zoom in">+</button>
		<span id="zoomLabel" class="readout">100%</span>
	</header>
	<main id="layout">

		<aside id="leftSidebar">
			<section class="pane">
				<h2>
					Frames <span class="count" id="frameCount"></span>
					<button class="pane-action" id="btnNewFrame" title="Duplicate selected frame">+</button>
				</h2>
				<ul id="frameList" class="list"></ul>
			</section>

			<section class="pane">
				<h2>
					Sequences <span class="count" id="sequenceCount"></span>
					<button class="pane-action" id="btnNewSequence" title="New sequence">+</button>
				</h2>
				<ul id="sequenceList" class="list"></ul>
			</section>
		</aside>

		<section id="center">
			<div id="viewportWrap">
				<canvas id="viewport"></canvas>
				<div id="emptyMessage">Load a sheet to begin.</div>
			</div>
		</section>

		<aside id="rightSidebar">
			<section class="pane">
				<h2>Frame</h2>
				<div id="frameInspector"></div>
			</section>

			<section class="pane">
				<h2>Sequence</h2>
				<div id="sequenceInspector"></div>
			</section>

			<section class="pane">
				<h2>Colours</h2>
				<div id="palettePanel"></div>
			</section>

			<section class="pane">
				<h2>Brush</h2>
				<div id="brushPicker" class="brush-picker"></div>
			</section>
		</aside>
	</main>

	<footer id="statusBar">
		<span id="statusMessage">Ready.</span>
		<span id="coordReadout" class="readout"></span>
	</footer>

	<script src="sprite.js"></script>
	<script type="module" src="main.js"></script>
</body>
</html>
